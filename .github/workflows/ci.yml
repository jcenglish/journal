name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      # Adjust these two to match backend/config/database.yml's test section —
      # Rails 8's generator may name these differently depending on setup.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Run backend CI pipeline
        run: bin/ci

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Read from frontend/.nvmrc so CI and local can't drift — vitest and
          # jsdom both require Node 22.x, and Node 20 fails at runtime rather
          # than at install. Mirrors how the backend job reads .ruby-version.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Run tests with coverage (thresholds enforced in vite.config.ts)
        run: npm run test -- --coverage
      - run: npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  patch-coverage:
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: coverage/backend

      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: coverage/frontend

      # Both tools write source paths relative to their own project directory;
      # diff-cover matches them against repo-root paths from git diff.
      - name: Prefix coverage paths with project directory
        run: |
          sed -E 's#^SF:(\./)?#SF:backend/#' coverage/backend/lcov.info > coverage/backend.lcov
          sed -E 's#^SF:(\./)?#SF:frontend/#' coverage/frontend/lcov.info > coverage/frontend.lcov

      - name: Check coverage of changed lines
        run: pipx run --spec diff-cover==10.6.0 diff-cover coverage/backend.lcov coverage/frontend.lcov --compare-branch=origin/main --fail-under=80
