services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: ${BACKEND_DATABASE_PASSWORD:?set BACKEND_DATABASE_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY in deploy/.env}
      BACKEND_DATABASE_HOST: postgres
      BACKEND_DATABASE_PASSWORD: ${BACKEND_DATABASE_PASSWORD}
      APP_HOST: ${APP_HOST:?set APP_HOST in deploy/.env}
      SOLID_QUEUE_IN_PUMA: "true"
      FORWARD_HEADERS: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST}
      TLS_ARGS: ${TLS_ARGS:-internal}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - ./certs:/certs:ro

volumes:
  postgres-data:
  caddy-data:
